variables:
  MAVEN_OPTS: >-
    -Dhttps.protocols=TLSv1.2
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dorg.slf4j.simpleLogger.showDateTime=true
    -Djava.awt.headless=true

  MAVEN_CLI_OPTS: >-
    --batch-mode
    --errors
    --fail-at-end
    --show-version
    --no-transfer-progress
    -DinstallAtEnd=true
    -DdeployAtEnd=true

image: maven:3.8.5-openjdk-18

cache:
  paths:
    - .m2/repository

.build:
  stage: build
  script:
    - 'mvn $MAVEN_CLI_OPTS compile'
  except:
    variables:
      - $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.verify:
  stage: test
  script:
    - 'mvn $MAVEN_CLI_OPTS verify'
  except:
    variables:
      - $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.spotless-check:
  stage: test
  script:
    - 'git ls-remote origin'
    - 'mvn $MAVEN_CLI_OPTS com.diffplug.spotless:spotless-maven-plugin:2.35.0:check'
  except:
    variables:
      - $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  extends:
    - .build

test:
  extends:
    - .verify

spotless:
  extends:
    - .spotless-check